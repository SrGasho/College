<html>
    <head>
        <title>REGISTRO</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
    </head>
    <body>
        <div class="contenedor_principal">
            <div class="menu_registro">
                <form action="registroServlet">
                    <div class="elementos">
                        <label>NOMBRE:</label>
                        <input type="text" name="nombreRegistro" id="nombreRegistro">
                    </div>
                    <div class="elementos">
                        <label>NUMERO DE CELULAR</label>
                        <input type="number" name="celularRegistro" id="celularRegistro">
                    </div>
                    <div class="elementos">
                        <label>CONTRASEÑA</label>
                        <input type="password" name="passRegistro" id="passRegistro">
                    </div>
                    <input type="submit" value="REGISTRAR">
                </form>
            </div>
        </div>
    </body>
</html>
